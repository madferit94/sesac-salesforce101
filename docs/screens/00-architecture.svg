<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 768" width="1000" height="768" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="입출금 대조 앱 전체 구조">
  <rect width="1000" height="768" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c5c5c"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="24" y="40" font-size="20" font-weight="700" fill="#181818">입출금 대조 앱 전체 구조 한 장</text>
  <text x="24" y="62" font-size="13" fill="#5c5c5c">위에서 아래로: 화면 → 자동 기능 → 데이터 → 권한</text>

  <!-- 층 배경 -->
  <rect x="16" y="80" width="968" height="112" rx="12" fill="#f7f9fc"/>
  <rect x="16" y="232" width="968" height="96" rx="12" fill="#f7f9fc"/>
  <rect x="16" y="376" width="968" height="264" rx="12" fill="#f7f9fc"/>
  <rect x="16" y="656" width="968" height="88" rx="12" fill="#f7f9fc"/>

  <!-- 층 이름 -->
  <g fill="#181818">
    <text x="28" y="132" font-size="15" font-weight="700">① 화면</text>
    <text x="28" y="152" font-size="11.5" fill="#5c5c5c">사람이 보는 곳</text>
    <text x="28" y="276" font-size="15" font-weight="700">② 자동 기능</text>
    <text x="28" y="296" font-size="11.5" fill="#5c5c5c">알아서 일하는 곳</text>
    <text x="28" y="500" font-size="15" font-weight="700">③ 데이터</text>
    <text x="28" y="520" font-size="11.5" fill="#5c5c5c">저장되는 곳</text>
    <text x="28" y="696" font-size="15" font-weight="700">④ 권한</text>
    <text x="28" y="716" font-size="11.5" fill="#5c5c5c">누가 쓰는지</text>
  </g>

  <!-- 연결선 -->
  <g fill="none" stroke="#5c5c5c" stroke-width="1.5">
    <path d="M440 186V208H418V390" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M276 322V390" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M844 240V186" marker-end="url(#arr)"/>
    <path d="M844 392V322" marker-end="url(#arr)"/>
    <path d="M632 448H490" marker-end="url(#arr)"/>
    <path d="M316 504V558" marker-end="url(#arr)"/>
    <path d="M844 504V558" marker-end="url(#arr)"/>
    <path d="M700 504V532H420V558" marker-end="url(#arr)"/>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M500 322L470 390"/>
    <path d="M620 322L660 390"/>
  </g>

  <!-- 연결선 라벨 -->
  <g font-size="12" fill="#3e3e3c">
    <text x="410" y="226" text-anchor="end">입력·조회</text>
    <text x="284" y="362">저장 → 판정 → 기록</text>
    <text x="852" y="220">숫자 계산해서 표시</text>
    <text x="852" y="362">읽어서 집계</text>
    <text x="560" y="362" text-anchor="middle">필드 안에서 자동 계산</text>
    <text x="560" y="440" text-anchor="middle">주-세부</text>
    <text x="560" y="468" text-anchor="middle">1 : N</text>
    <text x="324" y="540">대조 담당</text>
    <text x="852" y="540">상대방</text>
    <text x="560" y="526" text-anchor="middle">처리 담당</text>
  </g>

  <!-- ① 화면 -->
  <g>
    <rect x="144" y="88" width="264" height="96" rx="10" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/>
    <text x="160" y="112" font-size="14" font-weight="700" fill="#181818">앱: 입출금 대조</text>
    <text x="160" y="132" font-size="12" fill="#3e3e3c">앱 실행기에서 여는 업무 공간</text>
    <text x="160" y="150" font-size="12" fill="#3e3e3c">탭: 홈 · 일일 대조 · 미대조 항목</text>
    <text x="160" y="168" font-size="12" fill="#3e3e3c">· Account · 직원</text>
  </g>
  <g>
    <rect x="428" y="88" width="264" height="96" rx="10" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/>
    <text x="444" y="112" font-size="14" font-weight="700" fill="#181818">일일 대조 화면</text>
    <text x="444" y="132" font-size="12" fill="#3e3e3c">대조 정보 · 잔액 · 상태와 보고</text>
    <text x="444" y="150" font-size="12" fill="#3e3e3c">보고 내용 (자동 작성)</text>
    <text x="444" y="168" font-size="12" fill="#3e3e3c">아래에 미대조 항목 목록</text>
  </g>
  <g>
    <rect x="712" y="88" width="264" height="96" rx="10" fill="#eef4ff" stroke="#0176d3" stroke-width="1.5"/>
    <text x="728" y="112" font-size="14" font-weight="700" fill="#181818">홈 화면</text>
    <text x="728" y="132" font-size="12" fill="#3e3e3c">입출금 대조 현황 카드</text>
    <text x="728" y="150" font-size="12" fill="#3e3e3c">상태별 건수 · 원인·담당별 막대</text>
    <text x="728" y="168" font-size="12" fill="#3e3e3c">확인 필요 목록 · 사용 안내</text>
  </g>

  <!-- ② 자동 기능 -->
  <g>
    <rect x="144" y="240" width="264" height="80" rx="10" fill="#fef4e8" stroke="#dd7a01" stroke-width="1.5"/>
    <text x="160" y="264" font-size="14" font-weight="700" fill="#181818">Flow: 일일 대조 상태 판정</text>
    <text x="160" y="284" font-size="12" fill="#3e3e3c">저장 시 진행 중·완료·보고 필요 판정</text>
    <text x="160" y="302" font-size="12" fill="#3e3e3c">보고 내용 자동 작성</text>
  </g>
  <g>
    <rect x="428" y="240" width="264" height="80" rx="10" fill="#fef4e8" stroke="#dd7a01" stroke-width="1.5"/>
    <text x="444" y="264" font-size="14" font-weight="700" fill="#181818">자동 계산 필드</text>
    <text x="444" y="284" font-size="12" fill="#3e3e3c">차이 = 통장 잔액 − 시스템 잔액</text>
    <text x="444" y="302" font-size="12" fill="#3e3e3c">남은 항목 수 · 경과일</text>
  </g>
  <g>
    <rect x="712" y="240" width="264" height="80" rx="10" fill="#fef4e8" stroke="#dd7a01" stroke-width="1.5"/>
    <text x="728" y="264" font-size="14" font-weight="700" fill="#181818">홈 현황 계산 (Apex)</text>
    <text x="728" y="284" font-size="12" fill="#3e3e3c">상태별 건수</text>
    <text x="728" y="302" font-size="12" fill="#3e3e3c">원인·처리 담당별 집계</text>
  </g>

  <!-- ③ 데이터 -->
  <g>
    <rect x="144" y="392" width="344" height="112" rx="10" fill="#e5f0fb" stroke="#0b5cab" stroke-width="2"/>
    <text x="160" y="416" font-size="14" font-weight="700" fill="#181818">일일 대조 (신규) · 6건</text>
    <text x="160" y="436" font-size="12" fill="#3e3e3c">대조일 · 계좌 (체킹 / 패런트)</text>
    <text x="160" y="454" font-size="12" fill="#3e3e3c">시스템 잔액 · 통장 잔액 · 차이</text>
    <text x="160" y="472" font-size="12" fill="#3e3e3c">남은 항목 수 · 상태 · 보고 내용</text>
    <text x="160" y="490" font-size="12" fill="#3e3e3c">대조 담당 · 보고 일시</text>
  </g>
  <g>
    <rect x="632" y="392" width="344" height="112" rx="10" fill="#e5f0fb" stroke="#0b5cab" stroke-width="2"/>
    <text x="648" y="416" font-size="14" font-weight="700" fill="#181818">미대조 항목 (신규) · 8건</text>
    <text x="648" y="436" font-size="12" fill="#3e3e3c">있는 곳 · 거래 유형 · 입출금 · 금액</text>
    <text x="648" y="454" font-size="12" fill="#3e3e3c">원인 · 처리 담당 · 처리 사유</text>
    <text x="648" y="472" font-size="12" fill="#3e3e3c">해결 여부 · 경과일</text>
    <text x="648" y="490" font-size="12" fill="#3e3e3c">상대방 · 입금자명 · 입금 목적</text>
  </g>
  <g>
    <rect x="144" y="560" width="344" height="64" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="160" y="584" font-size="14" font-weight="700" fill="#181818">직원 (기존) · 6명</text>
    <text x="160" y="604" font-size="12" fill="#3e3e3c">지우 · 도윤 · 서아 + 팀장 하린 · 태오 · 유진</text>
  </g>
  <g>
    <rect x="632" y="560" width="344" height="64" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="648" y="584" font-size="14" font-weight="700" fill="#181818">Account (기존) · 5곳</text>
    <text x="648" y="604" font-size="12" fill="#3e3e3c">기업 4곳 · 은행 1곳 (상대방 유형)</text>
  </g>

  <!-- ④ 권한 -->
  <g>
    <rect x="144" y="664" width="832" height="72" rx="10" fill="#f4f0ff" stroke="#7f56d9" stroke-width="1.5"/>
    <text x="160" y="688" font-size="14" font-weight="700" fill="#181818">권한 세트: 입출금 대조 사용자 (내 계정에 할당)</text>
    <text x="160" y="708" font-size="12" fill="#3e3e3c">앱·탭 접근 · 두 오브젝트 읽기·생성·편집 · Account·직원 읽기</text>
    <text x="160" y="726" font-size="12" fill="#3e3e3c">상태·보고 내용은 읽기 전용 (Flow만 수정) · 홈 현황 Apex 사용</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" role="img" aria-label="Flow: 일일 대조 상태 판정">
  <rect width="960" height="800" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c5c5c"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#181818">Flow: 일일 대조 상태 판정</text>
  <text x="40" y="64" font-size="13" fill="#5c5c5c">일일 대조를 저장할 때 자동으로 상태를 판정하고 보고 내용을 작성합니다</text>

  <!-- 연결선 -->
  <g fill="none" stroke="#5c5c5c" stroke-width="1.5">
    <path d="M330 134V160" marker-end="url(#arrow)"/>
    <path d="M480 210H590" marker-end="url(#arrow)"/>
    <path d="M330 260V288" marker-end="url(#arrow)"/>
    <path d="M490 340H590" marker-end="url(#arrow)"/>
    <path d="M330 392V420" marker-end="url(#arrow)"/>
    <path d="M330 476V500" marker-end="url(#arrow)"/>
    <path d="M330 556V580" marker-end="url(#arrow)"/>
    <path d="M180 616H150V596H180" marker-end="url(#arrow)"/>
    <path d="M330 636V664" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M590 116H440" marker-end="url(#arrow)"/>
    <path d="M480 696H560" marker-end="url(#arrow)"/>
  </g>

  <!-- 연결선 라벨 -->
  <g font-size="12" fill="#5c5c5c">
    <text x="535" y="200" text-anchor="middle">아니오</text>
    <text x="340" y="279">예</text>
    <text x="540" y="330" text-anchor="middle">예</text>
    <text x="340" y="411">아니오</text>
    <text x="144" y="590" text-anchor="end">반복</text>
    <text x="340" y="655">항목을 다 돌면</text>
  </g>

  <!-- 시작 -->
  <rect x="220" y="86" width="220" height="48" rx="24" fill="#ebf7e6" stroke="#2e844a" stroke-width="2"/>
  <text x="330" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">일일 대조 저장</text>
  <text x="330" y="125" text-anchor="middle" font-size="11.5" fill="#3e3e3c">생성·수정 시, 저장 직전 실행</text>

  <!-- 다시 실행 안내 -->
  <rect x="590" y="84" width="300" height="64" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="740" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#181818">미대조 항목 해결·추가·삭제</text>
  <text x="740" y="131" text-anchor="middle" font-size="12" fill="#3e3e3c">남은 항목 수가 바뀌면 자동으로 다시 실행</text>

  <!-- 판정 1 -->
  <polygon points="330,160 480,210 330,260 180,210" fill="#fef1e6" stroke="#dd7a01" stroke-width="2"/>
  <text x="330" y="206" text-anchor="middle" font-size="14" fill="#181818">통장·시스템 잔액이</text>
  <text x="330" y="224" text-anchor="middle" font-size="14" fill="#181818">모두 입력됐나?</text>

  <!-- 결과: 진행 중 -->
  <rect x="590" y="178" width="260" height="64" rx="10" fill="#f3f3f3" stroke="#747474" stroke-width="2"/>
  <text x="720" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">상태 = 진행 중</text>
  <text x="720" y="227" text-anchor="middle" font-size="12.5" fill="#3e3e3c">정보 부족 (잔액 미입력)</text>

  <!-- 판정 2 -->
  <polygon points="330,288 490,340 330,392 170,340" fill="#fef1e6" stroke="#dd7a01" stroke-width="2"/>
  <text x="330" y="336" text-anchor="middle" font-size="14" fill="#181818">차이 0원이고</text>
  <text x="330" y="354" text-anchor="middle" font-size="14" fill="#181818">남은 항목 0건?</text>

  <!-- 결과: 완료 -->
  <rect x="590" y="308" width="260" height="64" rx="10" fill="#ebf7e6" stroke="#2e844a" stroke-width="2"/>
  <text x="720" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">상태 = 완료</text>
  <text x="720" y="357" text-anchor="middle" font-size="12.5" fill="#3e3e3c">보고 내용은 이력으로 유지</text>

  <!-- 남은 항목 조회 -->
  <rect x="180" y="420" width="300" height="56" rx="10" fill="#fdecef" stroke="#c23934" stroke-width="2"/>
  <text x="330" y="443" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">남은 항목 조회</text>
  <text x="330" y="464" text-anchor="middle" font-size="12.5" fill="#3e3e3c">해결 안 된 미대조 항목</text>

  <!-- 보고 머리말 -->
  <rect x="180" y="500" width="300" height="56" rx="10" fill="#eef4ff" stroke="#0176d3" stroke-width="2"/>
  <text x="330" y="523" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">보고 머리말 작성</text>
  <text x="330" y="544" text-anchor="middle" font-size="12.5" fill="#3e3e3c">날짜 · 계좌 · 차이 금액 · 남은 항목 수</text>

  <!-- 반복 -->
  <rect x="180" y="580" width="300" height="56" rx="10" fill="#fef1e6" stroke="#dd7a01" stroke-width="2"/>
  <text x="330" y="603" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">항목마다 한 줄씩 추가</text>
  <text x="330" y="624" text-anchor="middle" font-size="12.5" fill="#3e3e3c">입금자명 · 금액 · 원인 · 처리 담당</text>

  <!-- 결과: 보고 필요 -->
  <rect x="180" y="664" width="300" height="64" rx="10" fill="#fff4d6" stroke="#b07a00" stroke-width="2"/>
  <text x="330" y="691" text-anchor="middle" font-size="15" font-weight="700" fill="#181818">상태 = 보고 필요</text>
  <text x="330" y="713" text-anchor="middle" font-size="12.5" fill="#3e3e3c">보고 내용 저장 · 최초 보고 일시 기록</text>
  <text x="330" y="756" text-anchor="middle" font-size="11.5" fill="#5c5c5c">남은 항목이 없으면 "잔액 차이만 있음: 원인 확인 필요" 줄을 추가</text>

  <!-- 보고 내용 예시 -->
  <rect x="560" y="560" width="360" height="172" rx="10" fill="#f8f9fb" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="576" y="585" font-size="13" font-weight="700" fill="#181818">자동 작성된 보고 내용 (DR-0005)</text>
  <g font-size="12" fill="#3e3e3c">
    <text x="576" y="610">[10/14 패런트 계좌 대조 결과 보고]</text>
    <text x="576" y="630">차이 금액: +4,990,000원 / 남은 항목 2건</text>
    <text x="576" y="650">1. 한별물산 입금 5,000,000원</text>
    <text x="592" y="670">- 시스템 미반영 (처리 담당: 도윤)</text>
    <text x="576" y="690">2. 블루웨이브 로지스틱스 입금 10,000원</text>
    <text x="592" y="710">- 금액 다름(수수료) (처리 담당: 지우)</text>
  </g>
</svg>
